project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - 404.qmd
    - quarto/**

author:
  - name: Vagish Hemmige

bibliography: references.bib

website:
  title: "Universal face shields and SARS-CoV-2: an interrupted time series"
  site-url: https://vagishhemmige.github.io/COVID-infection-control
  repo-url: https://github.com/VagishHemmige/COVID-infection-control
  repo-branch: main
  repo-actions: [edit, issue]
  page-navigation: true

  sidebar:
    style: docked
    collapse-level: 3
    search: true
    contents:
      - href: index.qmd
        text: Home
        icon: house

      - href: quarto/background.qmd
        text: Background
        icon: book

      - section: Study design and methods
        contents:
          - href: quarto/study-design.qmd
            text: Study design
            icon: diagram-3
          - href: quarto/differences.qmd
            text: Differences from the original code
            icon: diagram-3

      - section: Code
        contents:
          - section: Setup and helper functions
            contents:
              - href: quarto/setup.qmd
                text: Setup
                icon: laptop
              - href: quarto/functions.qmd
                text: Functions
                icon: laptop

          - section: Data, models and figures
            contents:
              - href: quarto/prepare_data.qmd
                text: 1. Data
                icon: laptop
              - href: quarto/models.qmd
                text: 2. Models
                icon: laptop
              - href: quarto/figures.qmd
                text: 3. Figures
                icon: laptop

      - href: quarto/results.qmd
        text: Published results
        icon: clipboard-data

      - section: Project documents
        contents:
          - href: quarto/analysis-plan.qmd
            text: Analysis plan
            icon: file-earmark-ruled
          - href: quarto/architecture.qmd
            text: Architecture
            icon: file-earmark-ruled
          - href: quarto/agents.qmd
            text: AGENTS.md
            icon: file-earmark-ruled
          - href: quarto/repository-blueprint.qmd
            text: Repository blueprint
            icon: file-earmark-ruled

      - href: quarto/about.qmd
        text: About
        icon: info-circle

# Each kind of page has one cue, used both in the sidebar (icon and colour
# set here and in styles.css) and on the page (a callout of the same colour):
#   background                book icon, blue
#   study design and methods  diagram-3 icon, orange
#   R code                    laptop icon and the 💻 Rcode callout, pink
#   results                   clipboard-data icon and the 📊 Results callout, green
#   project documents         ruled-page icon, grey
# Yellow, with the ⏳ Pending callout, marks provisional content.
custom-callout:
  Rcode:
    icon: true
    icon-symbol: "💻"
    color: "#d63384"
  Results:
    icon: true
    icon-symbol: "📊"
    color: "#198754"
  Pending:
    icon: true
    icon-symbol: "⏳"
    color: "#f0c400"

filters:
  # Yellow marks for provisional content, and their Pending callout
  # (AGENTS.md, "Quarto website"). It runs before custom-callout, which
  # turns the callout it adds into a styled box.
  - quarto/_pending.lua
  - custom-callout

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    page-layout: full
    code-summary: "Click to show/hide R Code"

# The site shows code; it never runs the analysis. Only the hidden
# read_chunk() imports and the Architecture page's reader of
# ARCHITECTURE.md set eval: true.
execute:
  eval: false
